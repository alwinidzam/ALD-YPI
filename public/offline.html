<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ALD — Tidak Ada Koneksi</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center;
        background: linear-gradient(145deg, #061109 0%, #0c1f13 50%, #040d06 100%);
        color: #ecfdf5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        text-align: center; padding: 24px;
      }
      .card { max-width: 360px; }
      h1 { font-size: 18px; margin: 16px 0 8px; }
      p { font-size: 13px; color: rgba(236,253,245,0.65); line-height: 1.6; }
      button {
        margin-top: 20px; padding: 10px 20px; border-radius: 12px; border: none;
        background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white;
        font-weight: 700; font-size: 13px; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="1.8" style="margin:0 auto">
        <path d="M1 9a15 15 0 0 1 22 0M5 13a10 10 0 0 1 14 0M8.5 16.5a5 5 0 0 1 7 0M12 20h.01"/>
        <line x1="2" y1="2" x2="22" y2="22" stroke="#f59e0b"/>
      </svg>
      <h1>Tidak Ada Koneksi Internet</h1>
      <p>Sistem ALD memerlukan koneksi internet untuk memuat data terbaru dari server. Dokumen yang sudah pernah dibuka sebelumnya mungkin masih tersedia secara offline.</p>
      <button onclick="location.reload()">Coba Lagi</button>
    </div>
  </body>
</html>
